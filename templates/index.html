<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Juros Compostos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Calculadora de Juros Compostos</h1>

        <label for="principal">Valor inicial (R$)</label>
        <input type="number" id="principal" placeholder="Ex: 1000">

        <label for="taxa">Taxa de juros mensal (%)</label>
        <input type="number" id="taxa" placeholder="Ex: 1 (para 1%)">

        <label for="meses">Período (meses)</label>
        <input type="number" id="meses" placeholder="Ex: 12">

        <label for="aporte">Aporte mensal (R$)</label>
        <input type="number" id="aporte" placeholder="Ex: 200">

        <button onclick="calcular()">Calcular</button>

        <div id="resultado"></div>
    </div>

    <script src="{{ url_for('static', filename='Script.js') }}"></script>
</body>
</html>
